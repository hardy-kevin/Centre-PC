# Construit CentrePC.exe et le publie dans les « Releases » à chaque nouvelle version (étiquette vX.Y.Z).
# Centre PC lit ces Releases pour proposer ses mises à jour.
name: Publier une version

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compiler CentrePC.exe
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish CentrePC.csproj -c Release -o publish -p:Version=$v --nologo
          $h = (Get-FileHash publish/CentrePC.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path publish/CentrePC.exe.sha256 -Value "$h  CentrePC.exe" -Encoding ascii -NoNewline

      # Version Microsoft Store : construite seulement quand les identifiants du Store sont renseignés
      # dans les variables du dépôt (Settings > Secrets and variables > Actions > Variables).
      - name: Paquet Microsoft Store (MSIX)
        if: ${{ vars.STORE_IDENTITY_NAME != '' }}
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Path msix/Assets -Force | Out-Null
          Copy-Item publish/CentrePC.exe msix/
          Copy-Item Outils/store/Assets/* msix/Assets/
          $m = Get-Content Outils/store/AppxManifest.xml -Raw
          $m = $m.Replace('{IDENTITY}', '${{ vars.STORE_IDENTITY_NAME }}')
          $m = $m.Replace('{PUBLISHER}', '${{ vars.STORE_PUBLISHER }}')
          $m = $m.Replace('{PUBLISHER_NAME}', '${{ vars.STORE_PUBLISHER_NAME }}')
          $m = $m.Replace('{VERSION}', "$v.0")
          Set-Content msix/AppxManifest.xml $m -Encoding utf8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName pack /d msix /p "publish/CentrePC-$v.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx a échoué" }

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          name: Centre PC ${{ github.ref_name }}
          body_path: NOTES_VERSION.md
          files: |
            publish/CentrePC.exe
            publish/CentrePC.exe.sha256
            publish/*.msix
